[project]
name = "analisar-referencia"
version = "0.1.0"
description = "Análise local de vídeos de referência (cortes, transições, legendas, música) para perfis do OpenChatCut"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy",
  "opencv-python>=4.9,<5",  # o 5.x removeu o CascadeClassifier (detector de rosto)
  "pillow>=10.3",
  "faster-whisper>=1.1",
  "librosa>=0.10.2",
  "soundfile>=0.12",
  "shazamio>=0.7",
  "rapidocr-onnxruntime>=1.3",
  "demucs==4.0.1",
  "torch==2.5.1",
  "torchaudio==2.5.1",
  "yt-dlp",
  "websocket-client>=1.7",  # skill editar-anuncio: controla a janela do OpenChatCut (CDP)
]

[project.optional-dependencies]
# Transcrição na GPU NVIDIA (faster-whisper precisa de cuBLAS 12 + cuDNN 9).
gpu = [
  "nvidia-cublas-cu12",
  "nvidia-cudnn-cu12>=9,<10",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
